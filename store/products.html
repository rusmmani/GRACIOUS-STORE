<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><title>GRACIOUS — Shop</title></head><div class="loader"><div class="loader-inner"><img class="loader-logo" src="assets/logo.jpg"><div class="ring"></div><div class="loader-text" data-lang-id="loadingStore">Loading GRACIOUS</div></div></div><nav><a class="logo" href="index.html"><img src="assets/logo.jpg" alt="GRACIOUS"><span>GRACIOUS</span></a><div class="navlinks"><a href="products.html" data-lang-id="shop">Shop</a><a href="products.html?category=new-drop" data-lang-id="newDrop">New Drop</a><a href="products.html?category=essentials" data-lang-id="essentials">Essentials</a><a href="tracking.html" data-lang-id="track">Track Order</a></div><div class="actions"></div></nav>
<main><div class="wrap"><section class="products-top"><div class="eyebrow" data-lang-id="collectionEyebrow">GRACIOUS COLLECTION</div><h1 id="title" style="font-size:60px;letter-spacing:-.07em;margin:12px 0" data-lang-id="shopTitle">Shop</h1><div class="filters" id="filters"></div></section><section style="padding-top:15px"><div class="grid" id="grid"></div></section></div></main><footer><div class="wrap">© 2026 GRACIOUS — <span data-lang-id="footer">Premium Graphic Essentials.</span></div></footer><div class="toast"></div><script src="assets/config.js"></script><script src="assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await nav();const grid=document.getElementById('grid'),title=document.getElementById('title'),filters=document.getElementById('filters');filters.innerHTML='<button class="filter active" data-cat="all">'+t('all')+'</button>'+CATEGORIES.map(c=>`<button class="filter" data-cat="${esc(c.slug)}">${esc(categoryName(c.name))}</button>`).join('');const render=cat=>{const items=cat==='all'?PRODUCTS:PRODUCTS.filter(p=>p.cat===cat);renderCards(items,grid);const c=CATEGORIES.find(x=>x.slug===cat);title.textContent=cat==='all'?t('shopTitle'):categoryName(c?.name||'Collection');filters.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));applyStorePreferences()};filters.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b)render(b.dataset.cat)});render(categorySlugFromQuery())})</script></body></html>
