<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><title>GRACIOUS — Track Order</title></head><div class="loader"><div class="loader-inner"><img class="loader-logo" src="assets/logo.jpg"><div class="ring"></div><div class="loader-text" data-lang-id="loadingStore">Loading GRACIOUS</div></div></div><nav><a class="logo" href="index.html"><img src="assets/logo.jpg" alt="GRACIOUS"><span>GRACIOUS</span></a><div class="navlinks"><a href="products.html" data-lang-id="shop">Shop</a><a href="products.html?category=new-drop" data-lang-id="newDrop">New Drop</a><a href="products.html?category=essentials" data-lang-id="essentials">Essentials</a><a href="tracking.html" data-lang-id="track">Track Order</a></div><div class="actions"></div></nav>
<main><div class="wrap tracking"><div style="max-width:800px;margin:auto"><div class="eyebrow" data-lang-id="trackingEyebrow">ORDER TRACKING</div><h1 style="font-size:55px;letter-spacing:-.07em" data-lang-id="trackingTitle">Track your order.</h1><p style="color:#888" data-lang-id="trackingDesc">Enter your order code to view confirmation status and tracking information.</p><div class="track-form"><input id="code" data-lang-placeholder="trackPlaceholder" placeholder="GR-20260924-AB12"><button class="btn" id="track" data-lang-id="track">TRACK ↗</button></div><div id="result"></div></div></div></main><footer><div class="wrap">© 2026 GRACIOUS — <span data-lang-id="footer">Premium Graphic Essentials.</span></div></footer><div class="toast"></div><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
 await nav();
 const SB=window.supabase.createClient(window.GRACIOUS_CONFIG.supabaseUrl,window.GRACIOUS_CONFIG.supabaseAnonKey);
 document.getElementById('track').onclick=async()=>{const code=document.getElementById('code').value.trim().toUpperCase(),r=document.getElementById('result');r.innerHTML='<div class="status">'+esc(t('loading'))+'</div>';const {data,error}=await SB.rpc('get_order_tracking',{p_order_code:code});if(error||!data){r.innerHTML='<div class="status">'+esc(t('notFound'))+'</div>';return}const steps=['pending','confirmed','shipped','completed'],idx=Math.max(0,steps.indexOf(data.status));const labels={pending:t('received'),confirmed:t('confirmed'),shipped:t('shipped'),completed:t('completed')};r.innerHTML=`<div class="status"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">${esc(data.order_code)}</div><h2 style="margin:8px 0">${fmt(data.total)}</h2></div><span class="status-pill">${esc(data.status)}</span></div><div class="timeline">${steps.map((s,i)=>`<div class="event ${i<=idx?'done':''}">${labels[s]}${s==='shipped'&&data.tracking_number?' · Resi '+escapeHtml(data.tracking_number):''}</div>`).join('')}</div></div>`}
});
</script></body></html>
