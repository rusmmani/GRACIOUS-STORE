<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></html><title>GRACIOUS — Shopping Bag</title></head><body><div class="loader"><div class="loader-inner"><img class="loader-logo" src="assets/logo.jpg"><div class="ring"></div><div class="loader-text">Loading GRACIOUS</div></div></div><nav><a class="logo" href="index.html"><img src="assets/logo.jpg" alt="GRACIOUS"><span>GRACIOUS</span></a><div class="navlinks"><a href="products.html" data-lang-id="shop">Shop</a><a href="products.html?category=new" data-lang-id="newDrop">New Drop</a><a href="products.html?category=essentials" data-lang-id="essentials">Essentials</a><a href="tracking.html" data-lang-id="track">Track Order</a></div><div class="actions"><a class="icon" href="cart.html" data-cart aria-label="Bag" data-bag-link>◰ <span data-cart-count>0</span></a></div></nav><main><div class="wrap"><section style="padding-bottom:20px"><div class="eyebrow">YOUR SELECTION</div><h1 style="font-size:55px;letter-spacing:-.07em">Shopping Bag</h1></section><div class="bag-layout"><div class="panel" id="items"></div><aside class="panel"><div class="eyebrow">SUMMARY</div><div id="summary"></div><a class="btn" id="checkout" href="checkout.html" style="width:100%;margin-top:15px">CHECKOUT ↗</a></aside></div></div></main><footer><div class="wrap">© 2026 GRACIOUS — Premium Graphic Essentials.</div></footer><div class="toast"></div><script src="assets/config.js"></script><script src="assets/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{nav()});</script></body><script>document.addEventListener('DOMContentLoaded',()=>{const items=document.getElementById('items'),sum=document.getElementById('summary');function render(){const c=getCart();if(!c.length){items.innerHTML='<div style="padding:70px 10px;text-align:center;color:#777">Your bag is empty.<br><a class="btn" style="margin-top:18px" href="products.html">START SHOPPING ↗</a></div>';sum.innerHTML='';document.getElementById('checkout').style.display='none';return}document.getElementById('checkout').style.display='inline-flex';items.innerHTML=c.map((x,i)=>`<div class="row"><img src="${x.img}"><div><h3>${escapeHtml(x.name)}</h3><p>${x.preorder?'PRE-ORDER · ':''}Size ${x.size} · ${fmt(x.price)}</p><div class="qty"><button data-i="${i}" data-op="-">−</button><span>${x.qty}</span><button data-i="${i}" data-op="+">+</button></div></div><strong>${fmt(x.price*x.qty)}</strong></div>`).join('');const sub=c.reduce((a,x)=>a+x.price*x.qty,0);sum.innerHTML=`<div class="summary-line"><span>Subtotal</span><span>${fmt(sub)}</span></div><div class="summary-line"><span>Shipping</span><span>${fmt(SHIPPING)}</span></div><div class="summary-line total"><span>Total</span><span>${fmt(sub+SHIPPING)}</span></div>`;items.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;c[i].qty+=b.dataset.op==='+'?1:-1;if(c[i].qty<1)c.splice(i,1);setCart(c);render()})}render()})</script></html>
