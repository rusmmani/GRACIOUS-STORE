<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>GRACIOUS — Product</title></head><body><div class="loader"><div class="loader-inner"><img class="loader-logo" src="assets/logo.jpg"><div class="ring"></div><div class="loader-text">Loading GRACIOUS</div></div></div><nav><a class="logo" href="index.html"><img src="assets/logo.jpg" alt="GRACIOUS"><span>GRACIOUS</span></a><div class="navlinks"><a href="products.html" data-lang-id="shop">Shop</a><a href="products.html?category=new-drop" data-lang-id="newDrop">New Drop</a><a href="products.html?category=essentials" data-lang-id="essentials">Essentials</a><a href="tracking.html" data-lang-id="track">Track Order</a></div><div class="actions"></div></nav><main><div class="wrap"><div class="product-layout"><div class="gallery" id="gallery"></div><div class="info"><div class="eyebrow" id="badge"></div><h1 id="name"></h1><div class="price-lg" id="price"></div><p class="desc" id="desc"></p><div class="material-list" id="materials"></div><div class="eyebrow" style="margin-top:25px">SELECT SIZE</div><div class="sizes" id="sizes"></div><div class="note" id="stockNote"></div><button class="btn" id="add" data-order-cta data-preorder-text="PRE-ORDER ↗" data-order-text="ORDER NOW ↗" style="width:100%">PRE-ORDER ↗</button><div class="note" id="modeNote"></div><section class="reviews" id="reviews"><div class="eyebrow">REVIEWS</div><div class="review-summary"><div><strong id="reviewAvg">0.0</strong><div class="stars" id="reviewStars">★★★★★</div><div class="note" id="reviewCount">0 reviews</div></div><div class="review-bars" id="reviewBars"></div></div><div class="review-form"><h3>Rate this product</h3><div class="star-input" id="starInput"><button type="button" data-rating="1" aria-label="1 stars">★</button><button type="button" data-rating="2" aria-label="2 stars">★</button><button type="button" data-rating="3" aria-label="3 stars">★</button><button type="button" data-rating="4" aria-label="4 stars">★</button><button type="button" data-rating="5" aria-label="5 stars">★</button></div><input id="reviewName" class="input" maxlength="60" placeholder="Nama kamu"><textarea id="reviewComment" class="input" maxlength="1000" rows="4" placeholder="Tulis komentar tentang produk ini..."></textarea><label class="review-upload"><span>+ Tambahkan foto</span><input id="reviewPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="reviewPhotoPreview" class="review-photo-preview"></div><button class="btn" id="submitReview" type="button">KIRIM REVIEW ↗</button><div class="note" id="reviewStatus"></div></div><div class="review-list" id="reviewList"></div></section><div class="size-chart"><div class="eyebrow">SIZE CHART</div><img src="assets/size-chart.png" alt="Size chart GRACIOUS"><div class="note">Satuan dalam centimeter. Toleransi pengukuran ±1–2 cm.</div></div></div></div></div></main><footer><div class="wrap">© 2026 GRACIOUS — Premium Graphic Essentials.</div></footer><div class="toast"></div><script src="assets/config.js"></script><script src="assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await nav();const p=byId(new URLSearchParams(location.search).get('id'));if(!p){location.href='products.html';return}document.title='GRACIOUS — '+p.name;document.getElementById('name').textContent=p.name;document.getElementById('price').textContent=fmt(p.price);document.getElementById('badge').textContent=p.preorder?'PRE-ORDER':(p.badge||'ORDER');document.getElementById('desc').textContent=p.desc;document.getElementById('materials').innerHTML=`<span>${esc(p.material||'Matt Cotton 24s')}</span><span>${esc(p.printing||'Plastisol Screen Printing')}</span><span>Premium Hand Feel</span>`;document.getElementById('gallery').innerHTML=p.images.map((x,i)=>`<img src="${esc(x)}" alt="${esc(p.name)} ${i+1}" loading="lazy">`).join('');let size=(p.sizes||['S','M','L','XL']).includes('M')?'M':p.sizes[0];document.getElementById('sizes').innerHTML=(p.sizes||['S','M','L','XL']).map(s=>`<button class="size ${s===size?'selected':''}" data-size="${esc(s)}">${esc(s)}</button>`).join('');function updateStock(){const stock=stockForSize(p,size);document.getElementById('stockNote').textContent=stock>0?t('available',stock,size):t('out');const add=document.getElementById('add');add.disabled=stock<=0;add.textContent=stock<=0?t('sold'):(p.preorder?t('preorder'):t('orderNow'))}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('selected',x===b));updateStock();setupButtonMotion()});document.getElementById('modeNote').textContent=p.preorder?t('preorderItem'):t('readyItem');updateStock();document.getElementById('add').onclick=()=>{if(stockForSize(p,size)<=0)return;addCart(p.id,size,1);setTimeout(()=>location.href='cart.html',350)};setupButtonMotion();await initReviews(p.id)})
async function initReviews(productId){const sb=await supa();if(!sb)return;let selected=0;const input=document.getElementById('starInput');input.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.rating;input.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',+x.dataset.rating<=selected))});const photo=document.getElementById('reviewPhoto'),preview=document.getElementById('reviewPhotoPreview');photo.onchange=()=>{preview.innerHTML='';const f=photo.files?.[0];if(f){if(f.size>5*1024*1024){photo.value='';document.getElementById('reviewStatus').textContent='Foto maksimal 5 MB.';return}const img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt='Preview';preview.appendChild(img)}};async function load(){const {data,error}=await sb.from('product_reviews').select('*').eq('product_id',productId).order('created_at',{ascending:false});if(error)return;const rows=data||[],avg=rows.length?rows.reduce((a,r)=>a+r.rating,0)/rows.length:0;document.getElementById('reviewAvg').textContent=avg.toFixed(1);document.getElementById('reviewCount').textContent=rows.length+' review'+(rows.length===1?'':'s');const bars=document.getElementById('reviewBars');bars.innerHTML=[5,4,3,2,1].map(n=>{const c=rows.filter(r=>r.rating===n).length,p=rows.length?c/rows.length*100:0;return `<div><span>${n}★</span><i><b style="width:${p}%"></b></i><small>${c}</small></div>`}).join('');document.getElementById('reviewList').innerHTML=rows.map(r=>`<article class="review"><div class="review-head"><b>${esc(r.reviewer_name)}</b><span>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><div class="review-date">${new Date(r.created_at).toLocaleDateString('id-ID')}</div><p>${esc(r.comment)}</p>${r.photo_url?`<img src="${esc(r.photo_url)}" alt="Foto dari ${esc(r.reviewer_name)}">`:''}</article>`).join('')||'<div class="note">Belum ada review. Jadilah yang pertama.</div>'}await load();document.getElementById('submitReview').onclick=async()=>{const status=document.getElementById('reviewStatus'),name=document.getElementById('reviewName').value.trim()||'Anonymous',comment=document.getElementById('reviewComment').value.trim();if(!selected){status.textContent='Pilih rating bintang dulu.';return}if(!comment){status.textContent='Tulis komentar dulu.';return}const btn=document.getElementById('submitReview');btn.disabled=true;status.textContent='Mengirim review...';let url=null;const f=photo.files?.[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${productId}/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('review-images').upload(path,f,{contentType:f.type,upsert:false});if(up.error){status.textContent=up.error.message;btn.disabled=false;return}url=sb.storage.from('review-images').getPublicUrl(path).data.publicUrl}const ins=await sb.from('product_reviews').insert({product_id:productId,reviewer_name:name,rating:selected,comment,photo_url:url});if(ins.error){status.textContent=ins.error.message;btn.disabled=false;return}document.getElementById('reviewComment').value='';document.getElementById('reviewName').value='';photo.value='';preview.innerHTML='';selected=0;input.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));status.textContent='Review berhasil dikirim.';btn.disabled=false;await load()}}</script></body></html>
