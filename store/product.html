<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><title>GRACIOUS — Product</title></head><body><div class="loader"><div class="loader-inner"><img class="loader-logo" src="assets/logo.jpg"><div class="ring"></div><div class="loader-text">Loading GRACIOUS</div></div></div><nav><a class="logo" href="index.html"><img src="assets/logo.jpg" alt="GRACIOUS"><span>GRACIOUS</span></a><div class="navlinks"><a href="products.html">Shop</a><a href="products.html?category=new-drop">New Drop</a><a href="products.html?category=essentials">Essentials</a><a href="tracking.html">Track Order</a></div><div class="actions"><a class="icon" href="cart.html" data-cart>◰ <span data-cart-count>0</span></a></div></nav><main><div class="wrap"><div class="product-layout"><div class="gallery" id="gallery"></div><div class="info"><div class="eyebrow" id="badge"></div><h1 id="name"></h1><div class="price-lg" id="price"></div><p class="desc" id="desc"></p><div class="material-list" id="materials"></div><div class="eyebrow" style="margin-top:25px">SELECT SIZE</div><div class="sizes" id="sizes"></div><div class="note" id="stockNote"></div><button class="btn" id="add" data-order-cta data-preorder-text="PRE-ORDER ↗" data-order-text="ORDER NOW ↗" style="width:100%">PRE-ORDER ↗</button><div class="note" id="modeNote"></div><div class="size-chart"><div class="eyebrow">SIZE CHART</div><img src="assets/size-chart.png" alt="Size chart GRACIOUS"><div class="note">Satuan dalam centimeter. Toleransi pengukuran ±1–2 cm.</div></div></div></div></div></main><footer><div class="wrap">© 2026 GRACIOUS — Premium Graphic Essentials.</div></footer><div class="toast"></div><script src="assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await nav();const p=byId(new URLSearchParams(location.search).get('id'));if(!p){location.href='products.html';return}document.title='GRACIOUS — '+p.name;document.getElementById('name').textContent=p.name;document.getElementById('price').textContent=fmt(p.price);document.getElementById('badge').textContent=p.preorder?'PRE-ORDER':(p.badge||'ORDER');document.getElementById('desc').textContent=p.desc;document.getElementById('materials').innerHTML=`<span>${esc(p.material||'Matt Cotton 24s')}</span><span>${esc(p.printing||'Plastisol Screen Printing')}</span><span>Premium Hand Feel</span>`;document.getElementById('gallery').innerHTML=p.images.map((x,i)=>`<img src="${esc(x)}" alt="${esc(p.name)} ${i+1}" loading="lazy">`).join('');let size=(p.sizes||['S','M','L','XL']).includes('M')?'M':p.sizes[0];document.getElementById('sizes').innerHTML=(p.sizes||['S','M','L','XL']).map(s=>`<button class="size ${s===size?'selected':''}" data-size="${esc(s)}">${esc(s)}</button>`).join('');function updateStock(){const stock=stockForSize(p,size);document.getElementById('stockNote').textContent=stock>0?`${stock} pcs tersedia untuk size ${size}.`:'Size ini sedang habis.';const add=document.getElementById('add');add.disabled=stock<=0;add.textContent=stock<=0?'SOLD OUT':(p.preorder?'PRE-ORDER ↗':'ORDER NOW ↗')}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('selected',x===b));updateStock();setupButtonMotion()});document.getElementById('modeNote').textContent=p.preorder?'Pre-order item. Detail pengiriman akan dikonfirmasi admin setelah pesanan diterima.':'Ready to order. Pesanan akan diproses setelah konfirmasi admin.';updateStock();document.getElementById('add').onclick=()=>{if(stockForSize(p,size)<=0)return;addCart(p.id,size,1);setTimeout(()=>location.href='cart.html',350)};setupButtonMotion()})</script></body></html>
