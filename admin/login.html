<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRACIOUS Admin</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head><body><div class="login"><form class="login-card" id="login"><div class="brand"><img src="../store/assets/logo.jpg"> GRACIOUS ADMIN</div><h1>Control Center</h1><p class="muted">Login memakai Supabase Auth. Buat akun admin dari Supabase Dashboard.</p><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%">LOGIN ↗</button><p id="msg" class="muted"></p></form></div><script>const SB=window.supabase.createClient(window.EDTV_CONFIG.SUPABASE_URL,window.EDTV_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});document.getElementById('login').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg'),btn=e.submitter;msg.textContent='Memverifikasi login…';if(btn)btn.disabled=true;try{const {data,error}=await SB.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:{session}}=await SB.auth.getSession();if(!session)throw new Error('Session login tidak tersimpan. Coba refresh halaman lalu login lagi.');location.replace('index.html')}catch(err){msg.textContent=err?.message||'Login gagal.'}finally{if(btn)btn.disabled=false}}</script></body></html>
