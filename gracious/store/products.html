<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><title>GRACIOUS — Shop</title></head><body><div class="loader"><div class="loader-inner"><img class="loader-logo" src="assets/logo.jpg"><div class="ring"></div><div class="loader-text">Loading GRACIOUS</div></div></div><nav><a class="logo" href="index.html"><img src="assets/logo.jpg" alt="GRACIOUS"><span>GRACIOUS</span></a><div class="navlinks"><a href="products.html">Shop</a><a href="products.html?category=new-drop">New Drop</a><a href="products.html?category=essentials">Essentials</a><a href="tracking.html">Track Order</a></div><div class="actions"><a class="icon" href="cart.html" data-cart aria-label="Bag">◰ <span data-cart-count>0</span></a></div></nav><main><div class="wrap"><section class="products-top"><div class="eyebrow">GRACIOUS / COLLECTION</div><h1 id="title" style="font-size:60px;letter-spacing:-.07em;margin:12px 0">Shop</h1><div class="filters" id="filters"><button class="filter active" data-cat="all">All</button><button class="filter" data-cat="new-drop">New Drop</button><button class="filter" data-cat="essentials">Essentials</button></div></section><section style="padding-top:15px"><div class="grid" id="grid"></div></section></div></main><footer><div class="wrap">© 2026 GRACIOUS — Premium Graphic Essentials.</div></footer><div class="toast"></div><script src="assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await nav();const grid=document.getElementById('grid'),title=document.getElementById('title'),filters=document.getElementById('filters');filters.innerHTML='<button class="filter active" data-cat="all">All</button>'+CATEGORIES.map(c=>`<button class="filter" data-cat="${esc(c.slug)}">${esc(c.name)}</button>`).join('');const render=cat=>{const items=cat==='all'?PRODUCTS:PRODUCTS.filter(p=>p.cat===cat);renderCards(items,grid);const c=CATEGORIES.find(x=>x.slug===cat);title.textContent=cat==='all'?'Shop':(c?.name||'Collection');filters.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));};filters.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b)render(b.dataset.cat)});render(categorySlugFromQuery())})</script></body></html>
