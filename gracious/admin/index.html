<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRACIOUS Admin</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head><body><div class="login"><form class="login-card" id="login"><div class="brand"><img src="../store/assets/logo.jpg"> GRACIOUS ADMIN</div><h1>Control Center</h1><p class="muted">Login memakai Supabase Auth. Buat akun admin dari Supabase Dashboard.</p><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%">LOGIN ↗</button><p id="msg" class="muted"></p></form></div><script>const SB=window.supabase.createClient(window.GRACIOUS_CONFIG.supabaseUrl,window.GRACIOUS_CONFIG.supabaseAnonKey);document.getElementById('login').onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){document.getElementById('msg').textContent=error.message;return}location.href='index.html'}</script></body></html>
